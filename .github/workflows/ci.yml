name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read
  checks: write

jobs:
  check:
    name: Run Quality Checks & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Quality Checks & Unit Tests
        run: ./gradlew ktlintCheck detekt lintDebug :build-logic:convention:test :app:testDebugUnitTest

      - name: Publish Test Report
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: '**/build/test-results/**/TEST-*.xml'